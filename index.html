<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="わが家">
<title>わが家の今日</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=4">
<link rel="icon" type="image/png" href="icons/icon-192.png?v=4">
<style>
/* ===== デザインの決まり（ここだけ見れば色・文字・角丸・余白がわかる） =====
   色：主ボタンは --accent-bg の1色。人の色（とと・まま）は名札と担当の印だけ。注意（未確認・期限）は --attn、済みは --done。
   文字：--t-large 28 / --t-title 20 / --t-body 17 / --t-sub 15 / --t-foot 13（最小 --t-cap 12）。太さは 400・600・700 の3つ。
   角丸：カード --r-card・ボタン --r-btn・札 --r-chip・シート --r-sheet の4つ。余白：8の倍数（細かい所は4と12）。押す所は44px以上。 */
:root{
  color-scheme:light dark;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --t-large:28px;--t-title:20px;--t-body:17px;--t-sub:15px;--t-foot:13px;--t-cap:12px;
  --r-card:16px;--r-btn:12px;--r-chip:999px;--r-sheet:24px;
  --bg:#F2F2F7;--card:#FFFFFF;--card2:#F2F2F7;--fill:rgba(118,118,128,.12);--field:#F2F2F7;
  --label:#000000;--label2:#6C6C70;--label3:#8E8E93;--sep:rgba(60,60,67,.16);--line:#C7C7CC;
  --accent:#0066D6;--accent-bg:#0071E3;--accent-soft:rgba(0,113,227,.11);--on-accent:#FFFFFF;
  --attn:#F08A00;--attn-ink:#9A5200;--attn-soft:#FFF4E0;
  --done:#248A3D;--done-soft:#E5F4E9;
  --danger:#D70015;--danger-soft:#FDECEE;
  --glass:rgba(249,249,251,.78);--glass-line:rgba(60,60,67,.2);
  --scrim:rgba(0,0,0,.32);--toast:rgba(28,28,30,.94);
  --pc-ink:100%;--pc-tint:13%;
  --ease:cubic-bezier(.2,.8,.2,1);
  --ease-spring:cubic-bezier(.3,1.25,.4,1);
  --ease-sheet:cubic-bezier(.32,1.08,.4,1);
}
/* ばねの動き：対応している端末（iOS 17.2〜）だけ本物のばねの曲線にする */
@supports (transition-timing-function:linear(0,1)){
  :root{--ease-sheet:linear(0,.02 1.6%,.09 3.6%,.33 8.4%,.62 14.6%,.82 21%,.94 28.4%,1.01 37.4%,1.025 45%,1.02 54%,1.005 70%,1);--ease-spring:linear(0,.009,.035 2.1%,.141 4.4%,.723 12.9%,.938,1.042 21.7%,1.075 25.1%,1.08 28.1%,1.064 32.2%,1.019 41.4%,.999 48.4%,.993 55.3%,1)}
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#000000;--card:#1C1C1E;--card2:#2C2C2E;--fill:rgba(118,118,128,.24);--field:#2C2C2E;
    --label:#FFFFFF;--label2:#AEAEB2;--label3:#8E8E93;--sep:rgba(84,84,88,.6);--line:#48484A;
    --accent:#4DA3FF;--accent-bg:#0A6CDA;--accent-soft:rgba(10,132,255,.2);
    --attn:#FF9F0A;--attn-ink:#FFB340;--attn-soft:rgba(255,159,10,.15);
    --done:#30D158;--done-soft:rgba(48,209,88,.15);
    --danger:#FF453A;--danger-soft:rgba(255,69,58,.16);
    --glass:rgba(22,22,24,.74);--glass-line:rgba(84,84,88,.55);
    --scrim:rgba(0,0,0,.55);--toast:rgba(58,58,60,.96);
    --pc-ink:58%;--pc-tint:30%;
  }
}
html,body{margin:0;background:var(--bg);-webkit-text-size-adjust:100%;overflow-x:clip}
#top{overflow-x:clip;background:var(--bg);color:var(--label);font-family:var(--font);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body{overscroll-behavior-y:none;font-family:var(--font)}
*{-webkit-tap-highlight-color:transparent}
#boot{min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:var(--font);color:var(--label2);font-size:15px}
a{color:var(--accent)}
button,input,textarea,select{font-family:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.strip::-webkit-scrollbar{display:none}

/* ===== 部品 ===== */
.btn{border:none;border-radius:var(--r-btn);font-weight:600;cursor:pointer;color:var(--label);background:var(--fill)}
.btn-fill{background:var(--accent-bg);color:var(--on-accent)}
.btn-tint{background:var(--accent-soft);color:var(--accent)}
.btn-gray{background:var(--fill);color:var(--label)}
.btn-danger{background:var(--danger-soft);color:var(--danger)}
.btn-link{border:none;background:transparent;color:var(--accent);font-weight:600;cursor:pointer}
.btn-close{position:absolute;top:8px;right:8px;width:44px;height:44px;padding:6px;border:none;border-radius:50%;background:var(--fill);background-clip:content-box;color:var(--label2);font-size:20px;line-height:1;cursor:pointer}
.field{box-sizing:border-box;border:1px solid transparent;border-radius:var(--r-btn);background:var(--field);color:var(--label);font-size:var(--t-body)}
.field:focus{border-color:var(--accent);outline:none;background:var(--card)}
.field::placeholder{color:var(--label3)}
.lbl{font-size:var(--t-foot);font-weight:600;color:var(--label2)}

/* 上のバー：すりガラス。大きな見出しが隠れたら、ロゴの横にタブの名前を出す */
.appbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(8px + env(safe-area-inset-top)) 16px 8px;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid transparent;transition:border-color .2s}
.collapsed .appbar{border-bottom-color:var(--glass-line)}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.logomark{width:32px;height:32px;flex-shrink:0;border-radius:9px;background:linear-gradient(140deg,#2EE88A 0%,#00C2A0 55%,#0090C8 100%);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,160,170,.3)}
.brandtext{display:grid;min-width:0}
.brandtext>*{grid-area:1/1;transition:opacity .25s var(--ease),transform .35s var(--ease-spring)}
.wordmark{margin:0;font-size:var(--t-body);font-weight:700;letter-spacing:.18em;color:var(--label);line-height:32px}
.bartitle{font-size:var(--t-body);font-weight:700;line-height:32px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transform:translateY(8px)}
.collapsed .bartitle{opacity:1;transform:none}
.collapsed .brandtext .wordmark{opacity:0;transform:translateY(-8px)}

/* タブの大きな見出し（iPhoneの Large Title） */
.tabhead{display:flex;flex-direction:column;gap:12px;padding:8px 16px 0}
.tabhead h2{margin:0;font-size:var(--t-large);font-weight:700;letter-spacing:-.01em;line-height:1.2;transition:opacity .2s}
.collapsed .tabhead h2{opacity:0}
.tabhead .sum{font-size:var(--t-foot);color:var(--label2);line-height:1.5}

/* 人の切り替え：iPhoneの標準の切り替え */
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;padding:2px;border-radius:10px;background:var(--fill)}
.seg button{min-height:44px;border:none;border-radius:8px;background:transparent;color:var(--label);font-size:var(--t-sub);font-weight:600;cursor:pointer;transition:background-color .2s,box-shadow .2s}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 3px 8px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.04)}
.seg-on-color{background:rgba(255,255,255,.16)}
.seg-on-color button{color:#FFFFFF}
.seg-on-color button[aria-pressed="true"]{background:#FFFFFF;color:#000000}
@media (prefers-color-scheme:dark){.seg button[aria-pressed="true"]{background:#636366}}

/* 数字の札 */
.statchip{flex-shrink:0;display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:88px;min-height:56px;padding:8px 12px;box-sizing:border-box;border:none;border-radius:var(--r-card);background:var(--card);color:var(--label);text-align:left;cursor:pointer}
.statchip .k{font-size:var(--t-cap);font-weight:600;color:var(--label2)}
.statchip .v{font-size:var(--t-title);font-weight:700;line-height:1.15}
.statchip[data-k="あなたの番"][data-on="1"] .v{color:var(--attn)}
.statchip[data-k="新着"] .v{color:var(--accent)}
.statchip[data-k="全部できた日"] .v{color:var(--done)}

/* 下のタブ：すりガラスの標準タブ */
.tabbar{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;box-sizing:border-box;display:grid;gap:0;padding:4px 8px env(safe-area-inset-bottom);background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--glass-line);z-index:25}
.tabbar button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;border:none;background:transparent;color:var(--label3);font-size:var(--t-cap);font-weight:600;cursor:pointer;transition:color .2s}
.tabbar button[aria-current="page"]{color:var(--accent)}
.tabbar button svg{width:26px;height:26px}
.tabbar .badge{position:absolute;top:2px;right:calc(50% - 24px);min-width:18px;height:18px;padding:0 5px;box-sizing:border-box;border-radius:9px;background:#FF3B30;color:#FFFFFF;font-size:var(--t-cap);font-weight:700;display:flex;align-items:center;justify-content:center;animation:pop .35s ease-out}

/* 線のアイコン：SF Symbols のように太さと角をそろえる（24の箱の物だけ） */
svg[viewBox="0 0 24 24"][fill="none"]{stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar svg[viewBox="0 0 24 24"][fill="none"]{stroke-width:1.7}

/* 押した時の小さな反応（指で押す端末だけ） */
@media (hover:none){
  button{transition:transform .35s var(--ease-spring),opacity .2s,background-color .2s,color .2s}
  button:active:not([aria-label$="閉じる"]):not(.tabbar button){transform:scale(.97);opacity:.85}
  .tabbar button:active svg{transform:scale(.88);transition:transform .2s}
}

/* 画面の切り替えの滑らかな動き（View Transitions。iOS 18〜。無い端末ではそのまま切り替わる） */
.appbar{view-transition-name:appbar}
.tabbar{view-transition-name:tabbar}
::view-transition-old(root){animation:vtOut .18s ease-in both}
::view-transition-new(root){animation:vtIn .32s var(--ease) both}
@keyframes vtOut{to{opacity:0;transform:scale(.985)}}
@keyframes vtIn{from{opacity:0;transform:translateY(8px)}}

@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes rise{0%{opacity:0;transform:translateY(18px)}100%{opacity:1;transform:none}}
@keyframes slideA{0%{opacity:0;transform:translateX(16px)}100%{opacity:1;transform:none}}
@keyframes slideB{0%{opacity:0;transform:translateX(16px)}100%{opacity:1;transform:none}}
@keyframes tickA{0%{opacity:0;transform:translateY(-60%)}100%{opacity:1;transform:none}}
@keyframes tickB{0%{opacity:0;transform:translateY(-60%)}100%{opacity:1;transform:none}}
@keyframes shimmer{0%{background-position:-390px 0}100%{background-position:390px 0}}
@keyframes heroIn{0%{opacity:0;transform:scale(.94) translateY(12px)}100%{opacity:1;transform:none}}
@keyframes bigTime{0%{letter-spacing:.2em;opacity:0}100%{letter-spacing:-.02em;opacity:1}}
@keyframes fall{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(520px) rotate(540deg);opacity:0}}
@keyframes ring{0%{transform:scale(.4);opacity:.6}100%{transform:scale(2.4);opacity:0}}
@keyframes barA{0%{width:0}100%{width:100%}}
@keyframes barB{0%{width:0}100%{width:100%}}
@keyframes capIn{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:none}}
@keyframes capIn2{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:none}}
[id^="w-"],section{scroll-margin-top:64px}
#ptr{position:fixed;top:calc(-44px + env(safe-area-inset-top));left:50%;transform:translate(-50%,0);opacity:0;z-index:90;display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;background:var(--toast);color:#FFFFFF;font:600 13px/1 var(--font);box-shadow:0 6px 18px rgba(0,0,0,.2);pointer-events:none;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
#ptr i{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#FFFFFF;box-sizing:border-box}
#ptr.spin i{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== 献立・買い物の部分（別の担当が作業中）に残る古い色を、上の決まりに合わせる =====
   その部分の inline style が CSS変数・クラスに移ったら、この段は消してよい */
#top [style*="font-weight: 900"]{font-weight:700 !important}
#top [style*="font-size: 10px"],#top [style*="font-size: 11px"]{font-size:var(--t-cap) !important}
#top h2[style*="font-size: 18px"]{font-size:var(--t-title) !important}
#top [style*="background: #FFFFFF"]{background-color:var(--card) !important}
#top [style*="background: #FAFBF9"]{background-color:var(--field) !important}
#top [style*="background: #EEF1EC"],#top [style*="background: #DDE3DA"]{background-color:var(--fill) !important}
#top [style*="background: #F4F6F2"],#top [style*="background: #F3F5EF"]{background-color:var(--card2) !important}
#top [style*="background: #F7F1DF"],#top [style*="background: #FFF6E8"],#top [style*="background: #F3E8D6"]{background-color:var(--attn-soft) !important}
#top [style*="background: #F2A33A"],#top [style*="background: #C99A1E"]{background-color:var(--attn) !important}
#top button[style*="background: #17201B"],#top button[style*="background: #2C6B52"]{background-color:var(--accent-bg) !important;color:var(--on-accent) !important;border-color:transparent !important}
#top [style*="color: #17201B"],#top [style*="color: #39433D"]{color:var(--label) !important}
#top [style*="color: #55605A"]{color:var(--label2) !important}
#top [style*="color: #2C6B52"]{color:var(--done) !important}
#top [style*="color: #8A5A12"],#top [style*="color: #8A6A0E"]{color:var(--attn-ink) !important}
#top [style*="solid #B9C3B5"],#top [style*="solid #C9D0C6"],#top [style*="solid #DDE3DA"],#top [style*="solid #ECEFE9"]{border-color:var(--sep) !important}
/* 入力欄はどこでも同じ見た目に */
#top input:not([type="checkbox"]):not([type="radio"]):not([type="file"]),#top textarea{border-color:transparent !important;background-color:var(--field) !important;color:var(--label) !important}
#top input:focus,#top textarea:focus{border-color:var(--accent) !important}
#top [style*="border-radius: 14px"],#top [style*="border-radius: 10px"]{border-radius:var(--r-btn) !important}
#top [style*="border-radius: 18px"],#top [style*="border-radius: 20px"],#top [style*="border-radius: 22px"],#top [style*="border-radius: 24px"]{border-radius:var(--r-card) !important}
/* 枠線だけのボタン・札は、iPhone風の薄い塗りに */
#top button[style*="background: transparent"][style*="border: 1.5px solid"]{border-color:transparent !important;background-color:var(--fill) !important;color:var(--label) !important}
#top button[style*="border: 1.5px solid #2C6B52"][style*="background: transparent"],#top button[style*="border: 1.5px solid #2EC28A"][style*="background: transparent"]{background-color:var(--accent-soft) !important;color:var(--accent) !important}
#top button[style*="border: 1.5px solid"][aria-pressed="true"]{border-color:transparent !important;background-color:var(--accent-bg) !important;color:var(--on-accent) !important}
#top button[style*="1.5px dashed"]{border-color:var(--sep) !important}

@media (prefers-reduced-motion:reduce){
  [data-lazy]{transition:none !important;transform:none !important;opacity:1 !important}
  *,::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none !important;transition:none !important}
  button:active{transform:none !important}
}
</style>
</head>
<body>
<div id="ptr" aria-hidden="true"><i></i><span>引っぱって更新</span></div>
<div id="app"><div id="boot">読み込んでいます…</div></div>
<template id="tpl">
<div id="top" style="width: 100%; max-width: 480px; margin: 0 auto; min-height: 100vh; padding-bottom: calc(112px + env(safe-area-inset-bottom)); box-sizing: border-box; display: flex; flex-direction: column; font-variant-numeric: tabular-nums">
<input id="photo-pick" type="file" accept="image/*,video/*" multiple onChange="{{uploadPhotos}}" style="display: none">

  <sc-if value="{{needLogin}}" hint-placeholder-val="{{ false }}">
    <div style="position: fixed; inset: 0; z-index: 80; background: var(--bg); display: flex; flex-direction: column; justify-content: center; gap: 16px; padding: 32px 24px calc(32px + env(safe-area-inset-bottom)); box-sizing: border-box; max-width: 480px; margin: 0 auto">
      <div style="width: 72px; height: 72px; border-radius: var(--r-card); background: linear-gradient(140deg, #2EE88A 0%, #00C2A0 55%, #0090C8 100%); display: flex; align-items: center; justify-content: center; animation: pop .5s ease-out both">
        <svg width="46" height="46" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5V12" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" fill="none"></path><path d="M12 12.5C12 8 9 5.5 4.8 5.6 4.6 9.8 7.4 12.6 12 12.5Z" fill="#FFFFFF"></path><path d="M12 12.5C12 8 15 5.5 19.2 5.6 19.4 9.8 16.6 12.6 12 12.5Z" fill="#FFFFFF" opacity=".78"></path></svg>
      </div>
      <h1 style="margin: 0; font-size: var(--t-large); font-weight: 700; line-height: 1.3; animation: rise .5s cubic-bezier(.2,.8,.2,1) .1s both">わが家の今日</h1>
      <p style="margin: 0; font-size: var(--t-sub); line-height: 1.8; color: var(--label); animation: rise .5s cubic-bezier(.2,.8,.2,1) .2s both">家族のGoogleアカウントでログインしてください。登録した2人だけが使えます。</p>
      <button type="button" onClick="{{login}}" class="btn btn-fill" style="min-height: 54px; font-size: var(--t-body); display: flex; align-items: center; justify-content: center; gap: 12px; animation: rise .5s cubic-bezier(.2,.8,.2,1) .3s both">{{loginLabel}}</button>
      <sc-if value="{{inBrowser}}" hint-placeholder-val="{{ false }}">
        <p style="margin: 0; padding: 12px 16px; border-radius: var(--r-card); background: var(--attn-soft); color: var(--attn-ink); font-size: var(--t-foot); line-height: 1.7">いまはブラウザ（Safariやリンク）で開いています。ここでのログインは、ホーム画面の「わが家」とは別あつかいです。ふだんはホーム画面のアイコンから開いてください。</p>
      </sc-if>
      <sc-if value="{{loginError}}" hint-placeholder-val="{{ false }}">
        <p role="alert" style="margin: 0; padding: 12px 16px; border-radius: var(--r-card); background: var(--danger-soft); color: var(--danger); font-size: var(--t-sub); line-height: 1.6">{{loginError}}</p>
      </sc-if>
    </div>
  </sc-if>

  <div class="appbar">
    <div class="brand">
      <span class="logomark" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24"><path d="M12 20.5V12" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" fill="none"></path><path d="M12 12.5C12 8 9 5.5 4.8 5.6 4.6 9.8 7.4 12.6 12 12.5Z" fill="#FFFFFF"></path><path d="M12 12.5C12 8 15 5.5 19.2 5.6 19.4 9.8 16.6 12.6 12 12.5Z" fill="#FFFFFF" opacity=".78"></path></svg>
      </span>
      <span class="brandtext"><h1 class="wordmark" aria-label="わが家の今日">WAGAYA</h1><span class="bartitle" aria-hidden="true">{{hdr.barTitle}}</span></span>
    </div>
    <button type="button" onClick="{{openAccount}}" aria-label="{{accountAria}}" style="{{syncStyle}}"><span style="display: inline-flex; align-items: center; gap: 4px">{{syncLabel}}<svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"></path></svg></span></button>
  </div>
  <sc-if value="{{hdr.small}}" hint-placeholder-val="{{ false }}">
  <header class="tabhead">
    <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
      <h2>{{hdr.smallTitle}}</h2>

        <p style="margin: 0; font-size: var(--t-sub); line-height: 1.7; white-space: pre-wrap; overflow-wrap: anywhere">{{rp.text}}</p>
        <div style="display: flex; justify-content: flex-end; gap: 4px">
          <sc-if value="{{rp.canReply}}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{rp.reply}}" class="btn-link" style="min-height: 36px; padding: 0 12px; font-size: var(--t-foot)">返信</button></sc-if>
          <sc-if value="{{rp.mine}}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{rp.del}}" style="min-height: 44px; padding: 0 12px; border: none; background: transparent; color: var(--danger); font-size: var(--t-cap); font-weight: 700; cursor: pointer">{{rp.delLabel}}</button></sc-if>
        </div>
      </div>
    </sc-for>
    <sc-if value="{{dt.canReply}}" hint-placeholder-val="{{ false }}">
      <sc-if value="{{replyToLabel}}" hint-placeholder-val="{{ false }}"><div style="display: flex; align-items: center; justify-content: space-between; font-size: var(--t-cap); font-weight: 700; color: var(--label2)"><span>{{replyToLabel}}</span><button type="button" onClick="{{cancelReplyTo}}" style="min-height: 44px; padding: 0 8px; border: none; background: transparent; color: var(--label2); font-size: var(--t-cap); cursor: pointer">返信をやめる</button></div></sc-if>
      <textarea id="reply-input" aria-label="コメント" rows="3" value="{{replyDraft}}" onInput="{{setReplyDraft}}" placeholder="コメントを書く" class="field" style="flex-shrink: 0; min-height: 76px; box-sizing: border-box; width: 100%; padding: 12px; line-height: 1.6; resize: vertical"></textarea>
      <button type="button" onClick="{{sendReply}}" class="btn btn-fill" style="min-height: 50px; font-size: var(--t-sub)">送信</button>
    </sc-if>
  </section>

  <button type="button" aria-label="Museへの相談を閉じる" onClick="{{closeMuse}}" style="{{museBackdropStyle}}"></button>
  <section role="dialog" aria-modal="true" aria-labelledby="muse-title" style="{{museSheetStyle}}">
    <button type="button" aria-label="閉じる" onClick="{{closeMuse}}" class="btn-close">×</button>
    <div aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: var(--line)"></div>
    <h2 id="muse-title" style="margin: 0; font-size: var(--t-title); font-weight: 700">Museに相談</h2>
    <p style="margin: 0; font-size: var(--t-foot); color: var(--label2); line-height: 1.6">Museに渡すのは、下の文だけです（写真・日記・メールは入りません）。消したいところは消してから送ってください。送るのは自分で、アプリからは自動で送りません。</p>
    <textarea id="muse-input" aria-label="Museに送る文" rows="10" value="{{museDraft}}" onInput="{{setMuseDraft}}" class="field" style="box-sizing: border-box; width: 100%; padding: 12px; line-height: 1.6; resize: vertical"></textarea>
    <sc-if value="{{hasMuseWa}}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{museWa}}" class="btn btn-fill" style="min-height: 50px; font-size: var(--t-sub)">WhatsAppのMuseで開く（文を入れた状態）</button></sc-if>
    <button type="button" onClick="{{museCopy}}" class="btn btn-fill" style="min-height: 50px; font-size: var(--t-sub)">文をコピーしてMuseを開く</button>
    <label style="display: flex; flex-direction: column; gap: 4px; font-size: var(--t-cap); color: var(--label2)">MuseのWhatsApp番号（任意・この端末だけに保存）<input type="tel" inputmode="tel" value="{{museWaNum}}" onInput="{{setMuseWaNum}}" placeholder="例：1 650 555 0100" class="field" style="box-sizing: border-box; width: 100%; min-height: 44px; padding: 0 12px"></label>
    <button type="button" onClick="{{closeMuse}}" class="btn btn-gray" style="min-height: 48px; font-size: var(--t-sub)">やめる</button>
  </section>
</div>
</template>
<script src="config.js?v=53"></script>
<script src="app.js?v=53"></script>
</body>
</html>
