<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EEF1EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="わが家">
<title>わが家の今日</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=4">
<link rel="icon" type="image/png" href="icons/icon-192.png?v=4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<style>
html,body{margin:0;background:#EEF1EC;-webkit-text-size-adjust:100%}
body{overscroll-behavior-y:none}
*{-webkit-tap-highlight-color:transparent}
#boot{min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;color:#55605A;font-size:14px}
a{color:#3046A6}a:hover{color:#22337A}
button{font-family:inherit}
button:focus-visible,input:focus-visible{outline:3px solid #3046A6;outline-offset:2px}
.strip::-webkit-scrollbar{display:none}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes rise{0%{opacity:0;transform:translateY(18px)}100%{opacity:1;transform:none}}
@keyframes slideA{0%{opacity:0;transform:translateX(28px)}100%{opacity:1;transform:none}}
@keyframes slideB{0%{opacity:0;transform:translateX(28px)}100%{opacity:1;transform:none}}
@keyframes tickA{0%{opacity:0;transform:translateY(-60%)}100%{opacity:1;transform:none}}
@keyframes tickB{0%{opacity:0;transform:translateY(-60%)}100%{opacity:1;transform:none}}
@keyframes shimmer{0%{background-position:-390px 0}100%{background-position:390px 0}}
@keyframes heroIn{0%{opacity:0;transform:scale(.94) translateY(12px)}100%{opacity:1;transform:none}}
@keyframes bigTime{0%{letter-spacing:.2em;opacity:0}100%{letter-spacing:-.02em;opacity:1}}
@keyframes fall{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(520px) rotate(540deg);opacity:0}}
@keyframes ring{0%{transform:scale(.4);opacity:.6}100%{transform:scale(2.4);opacity:0}}
@keyframes barA{0%{width:0}100%{width:100%}}
@keyframes barB{0%{width:0}100%{width:100%}}
@keyframes capIn{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:none}}
@keyframes capIn2{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:none}}
[id^="w-"],section{scroll-margin-top:12px}
#ptr{position:fixed;top:calc(-44px + env(safe-area-inset-top));left:50%;transform:translate(-50%,0);opacity:0;z-index:90;display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:#17201B;color:#FFFFFF;font:700 13px/1 'Zen Kaku Gothic New',system-ui,sans-serif;box-shadow:0 6px 18px rgba(23,32,27,.25);pointer-events:none}
#ptr i{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#FFFFFF;box-sizing:border-box}
#ptr.spin i{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* ===== 着せかえ：Apple風（data-theme="apple"） ===== */
#top[data-theme="apple"]{background:#F2F2F7 !important;color:#000 !important}
#top[data-theme="apple"],#top[data-theme="apple"] *{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif !important;-webkit-font-smoothing:antialiased}
#top[data-theme="apple"] [style*="font-weight: 900"]{font-weight:700 !important;letter-spacing:-.01em}
#top[data-theme="apple"] .appbar{background:rgba(242,242,247,.86) !important;backdrop-filter:saturate(180%) blur(20px) !important;border-bottom:.5px solid rgba(60,60,67,.2) !important}
#top[data-theme="apple"] .logomark{width:30px !important;height:30px !important;border-radius:8px !important}
#top[data-theme="apple"] .wordmark{font-size:17px !important;font-weight:600 !important;letter-spacing:.18em !important}
#top[data-theme="apple"] .appbar button{background:#E3E3E8 !important;color:#3C3C43 !important}
/* タブの見出し：iPhoneの大きな見出し */
#top[data-theme="apple"] .tabhead,#top[data-theme="apple"] .homehead{background:transparent !important;color:#000 !important;box-shadow:none !important;margin:4px 0 0 !important;padding:6px 16px 4px !important}
#top[data-theme="apple"] .tabhead h2{font-size:34px !important;font-weight:700 !important;letter-spacing:-.02em !important}
#top[data-theme="apple"] .tabhead span,#top[data-theme="apple"] .homehead span{opacity:1 !important}
#top[data-theme="apple"] .tabhead>div>div>span{color:#8E8E93 !important;font-size:15px !important;font-weight:400 !important}
#top[data-theme="apple"] .homehead>svg{display:none}
/* 切り替え：iPhoneの標準の切り替え */
#top[data-theme="apple"] .seg{background:rgba(118,118,128,.12) !important;border-radius:9px !important;padding:2px !important;gap:0 !important}
#top[data-theme="apple"] .seg button{min-height:36px !important;border-radius:7px !important;font-size:14px !important;font-weight:500 !important;color:#000 !important;background:transparent !important;box-shadow:none !important}
#top[data-theme="apple"] .seg button[aria-pressed="true"]{background:#FFFFFF !important;font-weight:600 !important;box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04) !important}
/* 数字の札：白いカード、色は数字だけ */
#top[data-theme="apple"] .statchip{background:#FFFFFF !important;color:#000 !important;box-shadow:none !important;border-radius:14px !important}
#top[data-theme="apple"] .statchip span:first-child{color:#8E8E93 !important;opacity:1 !important;font-weight:500 !important;font-size:12px !important}
#top[data-theme="apple"] .statchip[data-k="あなたの番"] span:last-child{color:#FF9500 !important}
#top[data-theme="apple"] .statchip[data-k="新着"] span:last-child{color:#007AFF !important}
#top[data-theme="apple"] .statchip[data-k="全部できた日"] span:last-child{color:#34C759 !important}
/* 下のタブ：すりガラスの白い標準タブ */
#top[data-theme="apple"] .tabbar{left:0 !important;right:0 !important;bottom:0 !important;max-width:none !important;border-radius:0 !important;padding:6px 8px calc(4px + env(safe-area-inset-bottom)) !important;background:rgba(249,249,249,.88) !important;backdrop-filter:saturate(180%) blur(20px) !important;-webkit-backdrop-filter:saturate(180%) blur(20px) !important;box-shadow:none !important;border-top:.5px solid rgba(60,60,67,.29) !important}
#top[data-theme="apple"] .tabbar button{background:transparent !important;color:#8E8E93 !important;font-weight:500 !important;font-size:10px !important;min-height:48px !important}
#top[data-theme="apple"] .tabbar button svg{stroke:currentColor !important;width:25px !important;height:25px !important}
#top[data-theme="apple"] .tabbar button[aria-current="page"]{color:#007AFF !important}
#top[data-theme="apple"] .tabbar button span[aria-hidden]{background:#FF3B30 !important;color:#FFFFFF !important;font-weight:600 !important}
/* ボタン：黒いボタンは青に、四角いカードは影をなくす */
#top[data-theme="apple"] button[style*="background: #17201B; color: #FFFFFF"]{background:#007AFF !important}
#top[data-theme="apple"] [style*="border-radius: 20px; background: #FFFFFF"],#top[data-theme="apple"] [style*="border-radius: 24px; background: #FFFFFF"]{box-shadow:none !important;border-radius:16px !important}
#top[data-theme="apple"] a{color:#007AFF !important}
#top[data-theme="apple"] [style*="2px solid #F2A33A"]{border:none !important}
#top[data-theme="apple"] [style*="border: 2px solid #DDE3DA"]{border:none !important;background:#F2F2F7 !important}
#top[data-theme="apple"] [style*="border: 2px solid #17201B"][aria-pressed="true"]{border:none !important;background:#E5F1FF !important;color:#007AFF !important}
#top[data-theme="apple"] [style*="border: 1.5px solid #2C6B52"]{border-color:#007AFF !important;color:#007AFF !important}
@media (prefers-reduced-motion: reduce){[data-lazy]{transition:none !important;transform:none !important;opacity:1 !important}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<div id="ptr" aria-hidden="true"><i></i><span>引っぱって更新</span></div>
<div id="app"><div id="boot">読み込んでいます…</div></div>
<template id="tpl">
<div id="top" data-theme="{{theme}}" style="width: 100%; max-width: 480px; margin: 0 auto; min-height: 100vh; padding-bottom: calc(110px + env(safe-area-inset-bottom)); box-sizing: border-box; background: #EEF1EC; font-family: 'Zen Kaku Gothic New', system-ui, sans-serif; color: #17201B; display: flex; flex-direction: column; font-variant-numeric: tabular-nums">

  <sc-if value="{{needLogin}}" hint-placeholder-val="{{ false }}">
    <div style="position: fixed; inset: 0; z-index: 80; background: #EEF1EC; display: flex; flex-direction: column; justify-content: center; gap: 18px; padding: 32px 28px calc(32px + env(safe-area-inset-bottom)); box-sizing: border-box; max-width: 480px; margin: 0 auto">
      <div style="width: 72px; height: 72px; border-radius: 18px; background: linear-gradient(140deg, #2EE88A 0%, #00C2A0 55%, #0090C8 100%); display: flex; align-items: center; justify-content: center; animation: pop .5s ease-out both">
        <svg width="46" height="46" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5V12" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" fill="none"></path><path d="M12 12.5C12 8 9 5.5 4.8 5.6 4.6 9.8 7.4 12.6 12 12.5Z" fill="#FFFFFF"></path><path d="M12 12.5C12 8 15 5.5 19.2 5.6 19.4 9.8 16.6 12.6 12 12.5Z" fill="#FFFFFF" opacity=".78"></path></svg>
      </div>
      <h1 style="margin: 0; font-size: 28px; font-weight: 900; line-height: 1.3; animation: rise .5s cubic-bezier(.2,.8,.2,1) .1s both">わが家の今日</h1>
      <p style="margin: 0; font-size: 15px; line-height: 1.8; color: #39433D; animation: rise .5s cubic-bezier(.2,.8,.2,1) .2s both">家族のGoogleアカウントでログインしてください。登録した2人だけが使えます。</p>
      <button type="button" onClick="{{login}}" style="min-height: 54px; border: none; border-radius: 16px; background: #17201B; color: #FFFFFF; font-size: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; animation: rise .5s cubic-bezier(.2,.8,.2,1) .3s both">{{loginLabel}}</button>
      <sc-if value="{{inBrowser}}" hint-placeholder-val="{{ false }}">
        <p style="margin: 0; padding: 12px 14px; border-radius: 12px; background: #FFF6E8; color: #5A4210; font-size: 13px; line-height: 1.7">いまはブラウザ（Safariやリンク）で開いています。ここでのログインは、ホーム画面の「わが家」とは別あつかいです。ふだんはホーム画面のアイコンから開いてください。</p>
      </sc-if>
      <sc-if value="{{loginError}}" hint-placeholder-val="{{ false }}">
        <p role="alert" style="margin: 0; padding: 12px 14px; border-radius: 12px; background: #F5E2E9; color: #7A2645; font-size: 14px; line-height: 1.6">{{loginError}}</p>
      </sc-if>
    </div>
  </sc-if>

  <div class="appbar" style="position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: calc(8px + env(safe-area-inset-top)) 16px 8px; background: rgba(238,241,236,0.92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid rgba(23,32,27,0.06)">
    <div style="display: flex; align-items: center; gap: 9px">
      <span class="logomark" aria-hidden="true" style="width: 34px; height: 34px; border-radius: 9px; background: linear-gradient(140deg, #2EE88A 0%, #00C2A0 55%, #0090C8 100%); display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 10px rgba(0,160,170,0.35)">
        <svg width="24" height="24" viewBox="0 0 24 24"><path d="M12 20.5V12" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" fill="none"></path><path d="M12 12.5C12 8 9 5.5 4.8 5.6 4.6 9.8 7.4 12.6 12 12.5Z" fill="#FFFFFF"></path><path d="M12 12.5C12 8 15 5.5 19.2 5.6 19.4 9.8 16.6 12.6 12 12.5Z" fill="#FFFFFF" opacity=".78"></path></svg>
      </span>
      <h1 class="wordmark" aria-label="わが家の今日" style="margin: 0; font-size: 18px; font-weight: 900; letter-spacing: .3em; color: #17201B">WAGAYA</h1>
    </div>
    <button type="button" onClick="{{openAccount}}" aria-label="{{accountAria}}" style="{{syncStyle}}"><span style="display: inline-flex; align-items: center; gap: 5px">{{syncLabel}}<svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"></path></svg></span></button>
  </div>
  <sc-if value="{{hdr.small}}" hint-placeholder-val="{{ false }}">
  <header class="tabhead" style="{{hdr.smallStyle}}">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px">
      <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
        <h2 style="margin: 0; font-size: 24px; font-weight: 900; letter-spacing: .02em">{{hdr.smallTitle}}</h2>
        <span style="font-size: 13px; font-weight: 700; opacity: .85; line-height: 1.5">{{hdr.smallSum}}</span>
      </div>
    </div>
<sc-if value="{{hdr.showWho}}" hint-placeholder-val="{{ true }}">
    <div class="seg" role="group" aria-label="誰の担当を見るか" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; background: rgba(255,255,255,0.14); border-radius: 12px; padding: 3px">
      <sc-for list="{{whoTabs}}" as="t" hint-placeholder-count="3">
        <button type="button" aria-pressed="{{t.pressed}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
      </sc-for>
    </div>
    </sc-if>
  </header>
  </sc-if>
  <sc-if value="{{hdr.big}}" hint-placeholder-val="{{ true }}">
  <header class="homehead" style="{{hdr.style}}">
    <svg aria-hidden="true" width="220" height="220" viewBox="0 0 220 220" style="position: absolute; right: -60px; top: -70px; opacity: .12; pointer-events: none"><circle cx="110" cy="110" r="100" fill="none" stroke="#FFFFFF" stroke-width="2"></circle><circle cx="110" cy="110" r="70" fill="none" stroke="#FFFFFF" stroke-width="2"></circle><circle cx="110" cy="110" r="40" fill="#FFFFFF"></circle></svg>
    <div style="position: relative; display: flex; flex-direction: column; gap: 2px; animation: rise .5s cubic-bezier(.2,.8,.2,1) both">
      <span style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px; font-weight: 700"><span style="opacity: .8">{{hdr.date}}</span>
        <sc-if value="{{hdr.hasWx}}" hint-placeholder-val="{{ false }}"><span style="display: inline-flex; align-items: center; gap: 5px; padding: 2px 10px 2px 6px; border-radius: 999px; background: rgba(255,255,255,0.16)">
          <sc-if value="{{hdr.wx.sun}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"></path></svg></sc-if>
          <sc-if value="{{hdr.wx.part}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="9" r="3"></circle><path d="M9 3v1M3 9h1M4.8 4.8l.7.7M13.2 4.8l-.7.7"></path><path d="M8 19h9a3.5 3.5 0 0 0 0-7 5 5 0 0 0-9.6 1.2A3 3 0 0 0 8 19z"></path></svg></sc-if>
          <sc-if value="{{hdr.wx.cloud}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18h10a4 4 0 0 0 0-8 6 6 0 0 0-11.5 1.5A3.3 3.3 0 0 0 7 18z"></path></svg></sc-if>
          <sc-if value="{{hdr.wx.rain}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 14h10a4 4 0 0 0 0-8 6 6 0 0 0-11.5 1.5A3.3 3.3 0 0 0 7 14z"></path><path d="M8 17l-1 3M12 17l-1 3M16 17l-1 3"></path></svg></sc-if>
          <sc-if value="{{hdr.wx.snow}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 14h10a4 4 0 0 0 0-8 6 6 0 0 0-11.5 1.5A3.3 3.3 0 0 0 7 14z"></path><path d="M8 18h.01M12 20h.01M16 18h.01"></path></svg></sc-if>
          <span>{{hdr.wx.label}}</span><span>{{hdr.wx.temp}}</span><span style="opacity: .85">{{hdr.wx.pop}}</span>
        </span></sc-if>
      </span>
      <span style="font-size: 26px; font-weight: 900; line-height: 1.25; letter-spacing: .01em">{{hdr.greet}}</span>
    </div>
    <div style="position: relative; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -18px; padding: 0 18px">
      <sc-for list="{{hdr.chips}}" as="c" hint-placeholder-count="3">
        <button type="button" class="statchip" data-k="{{c.k}}" onClick="{{c.go}}" style="{{c.style}}">
          <span style="font-size: 11px; font-weight: 700; opacity: .8">{{c.k}}</span>
          <span style="font-size: 18px; font-weight: 900; line-height: 1.15">{{c.v}}</span>
        </button>
      </sc-for>
    </div>
    <div class="seg" role="group" aria-label="誰の担当を見るか" style="position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; background: rgba(255,255,255,0.14); border-radius: 14px; padding: 4px">
      <sc-for list="{{whoTabs}}" as="t" hint-placeholder-count="3">
        <button type="button" aria-pressed="{{t.pressed}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
      </sc-for>
    </div>
  </header>
  </sc-if>
  <sc-if value="{{tiles.show}}" hint-placeholder-val="{{ false }}">
  <div style="padding: 14px 12px 0">
    <div style="margin: 0 6px; font-size: 13px; font-weight: 700; color: #6B706B">{{tiles.date}}</div>
    <div style="margin: 0 6px 12px; font-size: 26px; font-weight: 900; line-height: 1.25">{{tiles.greet}}</div>
    <div style="display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 118px; gap: 10px">
      <button type="button" aria-label="次の写真へ" onClick="{{tiles.nextPhoto}}" style="grid-row: span 2; position: relative; padding: 0; border: none; cursor: pointer; background: #FFFFFF; border-radius: 22px; box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 6px 18px rgba(0,0,0,.05); overflow: hidden; box-sizing: border-box; background: linear-gradient(160deg, #2C6B52 0%, #3E8A6B 45%, #C99A1E 100%)">
        <sc-if value="{{tiles.hasPhoto}}" hint-placeholder-val="{{ false }}"><img src="{{tiles.photoSrc}}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover"></sc-if>
        <sc-if value="{{tiles.hasPhoto}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 70px; background: linear-gradient(to top, rgba(0,0,0,.5), rgba(0,0,0,0))"></span></sc-if>
        <span style="position: absolute; left: 12px; right: 12px; bottom: 10px; text-align: left; color: #FFFFFF; font-size: 12px; font-weight: 700; text-shadow: 0 1px 4px rgba(0,0,0,.4)">{{tiles.age}}</span>
      </button>
      <div style="background: #FFFFFF; border-radius: 22px; box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 6px 18px rgba(0,0,0,.05); overflow: hidden; box-sizing: border-box; padding: 14px; display: flex; flex-direction: column; justify-content: space-between; background: linear-gradient(160deg, #F7C77E, #EE9A5B); color: #3A2410">
        <span style="display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 700"><span>{{tiles.wx.place}}</span><span>{{tiles.wx.kind}}</span></span>
        <sc-if value="{{tiles.hasWx}}" hint-placeholder-val="{{ false }}"><span><span style="display: block; font-size: 30px; font-weight: 900; line-height: 1">{{tiles.wx.max}}</span><span style="font-size: 12px; font-weight: 700">{{tiles.wx.minPop}}</span></span></sc-if>
      </div>
      <button type="button" onClick="{{tiles.goFlow}}" style="background: #FFFFFF; border-radius: 22px; box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 6px 18px rgba(0,0,0,.05); overflow: hidden; box-sizing: border-box; border: none; cursor: pointer; padding: 12px 14px; display: flex; align-items: center; gap: 10px; text-align: left; font-family: inherit; color: #17201B">
        <svg width="60" height="60" viewBox="0 0 100 100" aria-hidden="true" style="flex-shrink: 0"><circle cx="50" cy="50" r="42" fill="none" stroke="#E7ECE6" stroke-width="12"></circle><circle cx="50" cy="50" r="42" fill="none" stroke="#2C6B52" stroke-width="12" stroke-linecap="round" stroke-dasharray="263.9" stroke-dashoffset="{{tiles.ringOffset}}" transform="rotate(-90 50 50)" style="transition: stroke-dashoffset .7s"></circle></svg>

      <input id="ed-ourl" type="url" value="{{ed.url}}" onInput="{{ed.set.url}}" placeholder="https://…" style="box-sizing: border-box; width: 100%; min-height: 48px; padding: 0 12px; border-radius: 14px; border: 1.5px solid #C9D0C6; background: #FAFBF9; font-family: inherit; font-size: 16px; color: #17201B">
      <label for="ed-onote" style="font-size: 13px; font-weight: 700; color: #55605A">ひとこと</label>
      <input id="ed-onote" type="text" value="{{ed.note}}" onInput="{{ed.set.note}}" placeholder="例：芝生が広い・駐車場あり" style="box-sizing: border-box; width: 100%; min-height: 48px; padding: 0 12px; border-radius: 14px; border: 1.5px solid #C9D0C6; background: #FAFBF9; font-family: inherit; font-size: 16px; color: #17201B">
    </sc-if>
    <div style="display: flex; gap: 8px; margin-top: 6px">
      <button type="button" onClick="{{ed.cancel}}" style="flex: 1; min-height: 50px; border: 1.5px solid #C9D0C6; border-radius: 14px; background: transparent; color: #17201B; font-size: 15px; font-weight: 700; cursor: pointer">やめる</button>
      <button type="button" onClick="{{ed.save}}" style="flex: 2; min-height: 50px; border: none; border-radius: 14px; background: #17201B; color: #FFFFFF; font-size: 15px; font-weight: 700; cursor: pointer">保存する</button>
    </div>
    <sc-if value="{{ed.canDelete}}" hint-placeholder-val="{{ false }}">
      <button type="button" onClick="{{ed.del}}" style="{{ed.delStyle}}">{{ed.delLabel}}</button>
    </sc-if>
  </section>

  <button type="button" aria-label="要望の入力を閉じる" onClick="{{closeFb}}" style="{{fbBackdropStyle}}"></button>
  <section role="dialog" aria-modal="true" aria-labelledby="fb-title" style="{{fbSheetStyle}}">
    <button type="button" aria-label="閉じる" onClick="{{closeFb}}" style="position: absolute; top: 10px; right: 12px; width: 44px; height: 44px; border-radius: 50%; border: none; background: #EEF1EC; color: #39433D; font-size: 20px; line-height: 1; cursor: pointer">×</button>
    <div aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #C9D0C6"></div>
    <h2 id="fb-title" style="margin: 0; font-size: 20px; font-weight: 900">要望・不具合を書く</h2>
    <p style="margin: 0; font-size: 13px; color: #55605A; line-height: 1.6">「こうしたい」「ここが使いにくい」「こう動かない」を、そのまま書いてください。スプレッドシートの「要望」に入り、次の修正で読みます。</p>
    <textarea id="fb-input" aria-label="要望・不具合" rows="5" value="{{fbDraft}}" onInput="{{setFbDraft}}" placeholder="例：買い物リストで、買ったものを下にまとめてほしい" style="box-sizing: border-box; width: 100%; padding: 12px; border-radius: 14px; border: 1.5px solid #C9D0C6; font-family: inherit; font-size: 16px; line-height: 1.6; resize: none; background: #FAFBF9; color: #17201B"></textarea>
    <button type="button" onClick="{{closeFb}}" style="min-height: 48px; border: 1.5px solid #C9D0C6; border-radius: 14px; background: transparent; color: #17201B; font-size: 15px; font-weight: 700; cursor: pointer">やめる</button>
    <button type="button" onClick="{{sendFb}}" style="min-height: 50px; border: none; border-radius: 14px; background: #3046A6; color: #FFFFFF; font-size: 15px; font-weight: 700; cursor: pointer">送る</button>
  </section>

  <button type="button" aria-label="くわしくを閉じる" onClick="{{closeDetail}}" style="{{detailBackdropStyle}}"></button>
  <section role="dialog" aria-modal="true" aria-labelledby="dt-title" style="{{detailSheetStyle}}">
    <button type="button" aria-label="閉じる" onClick="{{closeDetail}}" style="position: absolute; top: 10px; right: 12px; width: 44px; height: 44px; border-radius: 50%; border: none; background: #EEF1EC; color: #39433D; font-size: 20px; line-height: 1; cursor: pointer">×</button>
    <div aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #C9D0C6"></div>
    <span style="font-size: 12px; font-weight: 900; color: #2C6B52">{{dt.kindLabel}}</span>
    <h2 id="dt-title" style="margin: 0 44px 0 0; font-size: 20px; font-weight: 900; line-height: 1.45; overflow-wrap: anywhere">{{dt.title}}</h2>
    <sc-if value="{{dt.hasMeta}}" hint-placeholder-val="{{ false }}"><span style="font-size: 13px; color: #55605A">{{dt.meta}}</span></sc-if>
    <sc-if value="{{dt.hasBody}}" hint-placeholder-val="{{ false }}"><p style="margin: 0; font-size: 15px; line-height: 1.8; white-space: pre-wrap; overflow-wrap: anywhere">{{dt.body}}</p></sc-if>
    <sc-if value="{{dt.hasLines}}" hint-placeholder-val="{{ false }}"><div style="display: flex; flex-direction: column; gap: 4px"><sc-for list="{{dt.lines}}" as="ln" hint-placeholder-count="2"><span style="padding: 10px 12px; border-radius: 12px; background: #F4F6F2; font-size: 14px; font-weight: 700">{{ln.text}}</span></sc-for></div></sc-if>
    <div style="display: flex; gap: 8px; flex-wrap: wrap">
      <sc-if value="{{dt.hasUrl}}" hint-placeholder-val="{{ false }}"><a href="{{dt.url}}" target="_blank" rel="noopener" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 12px; background: #EEF1EC; color: #17201B; font-size: 14px; font-weight: 700; text-decoration: none">リンクを開く</a></sc-if>
      <sc-if value="{{dt.hasCta}}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{dt.cta}}" style="min-height: 44px; padding: 0 14px; border-radius: 12px; border: 1.5px solid #B9C3B5; background: transparent; color: #17201B; font-size: 14px; font-weight: 700; cursor: pointer">{{dt.ctaLabel}}</button></sc-if>
    </div>
    <h3 style="margin: 10px 0 0; font-size: 15px; font-weight: 900">ふたりのやりとり</h3>
    <sc-if value="{{dt.empty}}" hint-placeholder-val="{{ false }}"><p style="margin: 0; font-size: 13px; color: #55605A">まだ返信はありません。</p></sc-if>
    <sc-for list="{{dt.replies}}" as="rp" hint-placeholder-count="0">
      <div style="{{rp.style}}">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px"><span style="{{rp.badgeStyle}}">{{rp.who}}</span><span style="font-size: 12px; color: #55605A">{{rp.time}}</span></div>
        <p style="margin: 0; font-size: 15px; line-height: 1.7; white-space: pre-wrap; overflow-wrap: anywhere">{{rp.text}}</p>
        <sc-if value="{{rp.mine}}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{rp.del}}" style="align-self: flex-end; min-height: 36px; padding: 0 10px; border: none; background: transparent; color: #7A2645; font-size: 12px; font-weight: 700; cursor: pointer">消す</button></sc-if>
      </div>
    </sc-for>
    <sc-if value="{{dt.canReply}}" hint-placeholder-val="{{ false }}">
      <textarea id="reply-input" aria-label="返信" rows="3" value="{{replyDraft}}" onInput="{{setReplyDraft}}" placeholder="返信を書く" style="box-sizing: border-box; width: 100%; padding: 12px; border-radius: 14px; border: 1.5px solid #C9D0C6; font-family: inherit; font-size: 16px; line-height: 1.6; resize: vertical; background: #FAFBF9; color: #17201B"></textarea>
      <button type="button" onClick="{{sendReply}}" style="min-height: 50px; border: none; border-radius: 14px; background: #17201B; color: #FFFFFF; font-size: 15px; font-weight: 700; cursor: pointer">返信する</button>
    </sc-if>
  </section>

  <button type="button" aria-label="Museへの相談を閉じる" onClick="{{closeMuse}}" style="{{museBackdropStyle}}"></button>
  <section role="dialog" aria-modal="true" aria-labelledby="muse-title" style="{{museSheetStyle}}">
    <button type="button" aria-label="閉じる" onClick="{{closeMuse}}" style="position: absolute; top: 10px; right: 12px; width: 44px; height: 44px; border-radius: 50%; border: none; background: #EEF1EC; color: #39433D; font-size: 20px; line-height: 1; cursor: pointer">×</button>
    <div aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #C9D0C6"></div>
    <h2 id="muse-title" style="margin: 0; font-size: 20px; font-weight: 900">Museに相談</h2>
    <p style="margin: 0; font-size: 13px; color: #55605A; line-height: 1.6">Museに渡すのは、下の文だけです（写真・日記・メールは入りません）。消したいところは消してから送ってください。送るのは自分で、アプリからは自動で送りません。</p>
    <textarea id="muse-input" aria-label="Museに送る文" rows="10" value="{{museDraft}}" onInput="{{setMuseDraft}}" style="box-sizing: border-box; width: 100%; padding: 12px; border-radius: 14px; border: 1.5px solid #C9D0C6; font-family: inherit; font-size: 15px; line-height: 1.6; resize: vertical; background: #FAFBF9; color: #17201B"></textarea>
    <sc-if value="{{hasMuseWa}}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{museWa}}" style="min-height: 50px; border: none; border-radius: 14px; background: #0E6B4E; color: #FFFFFF; font-size: 15px; font-weight: 700; cursor: pointer">WhatsAppのMuseで開く（文を入れた状態）</button></sc-if>
    <button type="button" onClick="{{museCopy}}" style="min-height: 50px; border: none; border-radius: 14px; background: #17201B; color: #FFFFFF; font-size: 15px; font-weight: 700; cursor: pointer">文をコピーしてMuseを開く</button>
    <label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #55605A">MuseのWhatsApp番号（任意・この端末だけに保存）<input type="tel" inputmode="tel" value="{{museWaNum}}" onInput="{{setMuseWaNum}}" placeholder="例：1 650 555 0100" style="box-sizing: border-box; width: 100%; min-height: 44px; padding: 0 12px; border-radius: 12px; border: 1.5px solid #C9D0C6; font-size: 16px; background: #FAFBF9; color: #17201B"></label>
    <button type="button" onClick="{{closeMuse}}" style="min-height: 48px; border: 1.5px solid #C9D0C6; border-radius: 14px; background: transparent; color: #17201B; font-size: 15px; font-weight: 700; cursor: pointer">やめる</button>
  </section>
</div>
</template>
<script src="config.js?v=29"></script>
<script src="app.js?v=29"></script>
</body>
</html>
